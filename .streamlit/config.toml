# LabExtract runs on patient data: serve on this computer only and send no usage statistics.
# To let other lab computers connect, change server.address deliberately (and only on a trusted network).
[server]
address = "localhost"
maxUploadSize = 500

[browser]
gatherUsageStats = false

[client]
# Hide the developer toolbar (Deploy button) in the lab.
toolbarMode = "minimal"

# Light, institutional design in the colours of the partner logos: Ministry of Health navy (#183060) for
# text, Central Virology Laboratory blue (#0077A8) for actions, green for approvals, and orange
# (#FFA500, constants.FLAG_COLOR) reserved for fields that need review.
[theme]
base = "light"
primaryColor = "#0077A8"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#EEF3F8"
textColor = "#1B2A41"
linkColor = "#0077A8"
borderColor = "#DCE4EC"
showWidgetBorder = true
baseRadius = "10px"
font = "Heebo:https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
dataframeHeaderBackgroundColor = "#EEF3F8"
dataframeBorderColor = "#DCE4EC"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FA"
