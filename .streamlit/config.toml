# LabExtract runs on patient data: serve on this computer only and send no usage statistics.
# To let other lab computers connect, change server.address deliberately (and only on a trusted network).
[server]
address = "localhost"
maxUploadSize = 500

[browser]
gatherUsageStats = false

[client]
# Hide the developer toolbar (Deploy button) in the lab.
toolbarMode = "minimal"

# Light design that follows the lab's page on the Sheba web site: deep indigo (#1B1A6B) for text and
# buttons, Sheba pink (#C8306F) and teal for highlights and approvals, pill buttons, and orange
# (#FFA500, constants.FLAG_COLOR) reserved for fields that need review.
[theme]
base = "light"
primaryColor = "#1B1A6B"
backgroundColor = "#F7F7FB"
secondaryBackgroundColor = "#F1F0F7"
textColor = "#24234A"
linkColor = "#C8306F"
borderColor = "#E3E2EE"
showWidgetBorder = true
baseRadius = "12px"
buttonRadius = "full"
font = "Rubik:https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
dataframeHeaderBackgroundColor = "#F1F0F7"
dataframeBorderColor = "#E3E2EE"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7FB"
